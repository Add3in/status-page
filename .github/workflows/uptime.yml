name: Status Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check websites
        run: |

          check_site() {
            result=$(curl -L -s -o /dev/null -w "%{http_code};%{time_total}" "$1")

            http_code=$(echo "$result" | cut -d';' -f1)
            response_time=$(echo "$result" | cut -d';' -f2)

            response_ms=$(awk "BEGIN {printf \"%.0f\", $response_time * 1000}")

            if [ "$http_code" = "200" ] || [ "$http_code" = "301" ] || [ "$http_code" = "302" ]; then
              echo "up;$response_ms"
            else
              echo "down;$response_ms"
            fi
          }

          GOOGLE=$(check_site "https://google.se")
          MICROSOFT=$(check_site "https://www.microsoft.com")
          GITHUB=$(check_site "https://github.com")

          SITE1=$(check_site "https://mdmportal.edu.stockholm.se/Start")
          SITE2=$(check_site "https://intranat.stockholm.se")
          SITE3=$(check_site "https://app.skolon.com/apps/my-collection")
          SITE4=$(check_site "https://elevstockholm.sharepoint.com/sites/startsidanforeleverochpersonal")
          SITE5=$(check_site "https://app.digiexam.com")
          SITE6=$(check_site "https://eu.smartsigncloud.com")
          SITE7=$(check_site "https://journal.prorenata.se")
          SITE8=$(check_site "https://agresso.stockholm.se/agrprod")
          SITE9=$(check_site "https://egensupport.se")
          SITE10=$(check_site "https://www.prezero.se")

          build_entry() {
            NAME="$1"
            VALUE="$2"

            STATUS=$(echo "$VALUE" | cut -d';' -f1)
            TIME=$(echo "$VALUE" | cut -d';' -f2)

            echo "{
              \"name\":\"$NAME\",
              \"status\":\"$STATUS\",
              \"responseTime\":$TIME
            }"
          }

          cat > status.json << EOF
          {
            "lastUpdated":"$(date -u)",
            "services":[
              $(build_entry "Google" "$GOOGLE"),
              $(build_entry "Microsoft" "$MICROSOFT"),
              $(build_entry "GitHub" "$GITHUB"),
              $(build_entry "MDM-portalen" "$SITE1"),
              $(build_entry "Intranätet" "$SITE2"),
              $(build_entry "Skolon" "$SITE3"),
              $(build_entry "Skolplattformen" "$SITE4"),
              $(build_entry "Digiexam" "$SITE5"),
              $(build_entry "Smartsign" "$SITE6"),
              $(build_entry "Prorenata" "$SITE7"),
              $(build_entry "Agresso" "$SITE8"),
              $(build_entry "Egensupport" "$SITE9"),
              $(build_entry "PreZero" "$SITE10")
            ]
          }
          EOF

      - name: Validate JSON
        run: |
          python -m json.tool status.json > /dev/null

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add status.json

          if ! git diff --staged --quiet; then
            git commit -m "Update status"
            git push
          fi
