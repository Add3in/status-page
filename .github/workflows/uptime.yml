name: Driftstatus

on:
  schedule:
    - cron: "*/1 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kontrollera tjänster
        run: |

          check_site () {

            name="$1"
            url="$2"

            response=$(curl \
              -o /dev/null \
              -s \
              -L \
              -w "%{http_code} %{time_total}" \
              "$url")

            code=$(echo "$response" | awk '{print $1}')
            time=$(echo "$response" | awk '{print $2}')

            case "$code" in
              200|301|302|401|403)
                status="up"
                ;;
              *)
                status="down"
                ;;
            esac

            ms=$(awk "BEGIN {printf \"%d\", $time * 1000}")

            echo "{\"name\":\"$name\",\"status\":\"$status\",\"responseTime\":$ms}"
          }

          sites=(
            "Google|https://google.se"
            "Microsoft|https://www.microsoft.com"
            "GitHub|https://github.com"

            "Sharepoint|https://elevstockholm.sharepoint.com/sites/startsidanforeleverochpersonal/"
            "MDM-portal|https://mdmportal.edu.stockholm.se/Start"
            "Digiexam|https://app.digiexam.com/app#/"
            "Smartsign|https://eu.smartsigncloud.com/#/screens"
            "Skolon|https://app.skolon.com/"
          )

          services="["
          up_count=0

          for site in "${sites[@]}"; do

            name="${site%%|*}"
            url="${site##*|}"

            result=$(check_site "$name" "$url")

            if [[ "$result" == *"\"status\":\"up\""* ]]; then
              ((up_count++))
            fi

            if [ "$services" != "[" ]; then
              services="$services,"
            fi

            services="$services$result"

          done

          services="$services]"

          total_count=${#sites[@]}
          down_count=$((total_count - up_count))

          ping_time=$(curl \
            -o /dev/null \
            -s \
            -w "%{time_total}" \
            https://www.google.com)

          ping_ms=$(awk "BEGIN {printf \"%d\", $ping_time * 1000}")

          cat > status.json << EOF
          {
            "lastUpdated":"$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "network":{
              "status":"up",
              "internet":"UP",
              "pingMs":$ping_ms,
              "dns":"OK"
            },
            "summary":{
              "total":$total_count,
              "up":$up_count,
              "down":$down_count
            },
            "services":$services
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions
