name: Driftstatus

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Kontrollera tjänster
        run: |

          check_site () {

            name="$1"
            url="$2"

            response=$(curl -o /dev/null \
              -s \
              -w "%{http_code} %{time_total}" \
              "$url")

            code=$(echo $response | awk '{print $1}')
            time=$(echo $response | awk '{print $2}')

            if [ "$code" = "200" ]; then
              status="up"
            else
              status="down"
            fi

            ms=$(awk "BEGIN {printf \"%d\", $time * 1000}")

            echo "{\"name\":\"$name\",\"status\":\"$status\",\"responseTime\":$ms}"
          }

          services=$(printf '[%s,%s,%s]' \
            "$(check_site "Google" "https://google.se")" \
            "$(check_site "Microsoft" "https://www.microsoft.com")" \
            "$(check_site "GitHub" "https://github.com")")

          cat > status.json << EOF
          {
            "lastUpdated":"$(date -u '+%Y-%m-%d %H:%M:%S UTC')",
            "services":$services
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add status.json

          if ! git diff --staged --quiet; then
            git commit -m "Update status"
            git push
          fi
