<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Driftstatus</title>

<style>

:root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #222;
    --shadow: rgba(0,0,0,0.10);
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #121212;
        --card: #1e1e1e;
        --text: #f5f5f5;
        --shadow: rgba(255,255,255,0.05);
    }
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    margin-bottom: 20px;
}

.summary {
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 15px;
    font-weight: bold;
    box-shadow: 0 2px 6px var(--shadow);
}

.updated {
    margin-bottom: 20px;
    color: #666;
}

.card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 6px var(--shadow);
}

.service-info {
    display: flex;
    flex-direction: column;
}

.service-name {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 4px;
}

.response-time {
    font-size: 13px;
}

.status {
    color: white;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 999px;
}

.up {
    background: #22c55e;
}

.down {
    background: #ef4444;
}

.legend {
    background: var(--card);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 6px var(--shadow);
}

.green {
    color: #22c55e;
    font-weight: bold;
}

.yellow {
    color: #f59e0b;
    font-weight: bold;
}

.red {
    color: #ef4444;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <div class="hero-banner">
    <img src="hero.png" alt="Driftstatus">

    <div class="overlay">
        <h1>📡 Driftstatus</h1>
        <p>Övervakning av verksamhetens tjänster</p>
    </div>
</div>

    <div id="summary" class="summary">
        Laddar status...
    </div>

    <div class="legend">
        🟢 &lt; 500 ms
        &nbsp;&nbsp;
        🟡 500-1000 ms
        &nbsp;&nbsp;
        🔴 &gt; 1000 ms
    </div>

    <div id="updated" class="updated"></div>

    <div id="services"></div>

</div>

<script>

async function loadStatus() {

    try {

        const response = await fetch(
            "status.json?v=" + Date.now()
        );

        const data = await response.json();

        document.getElementById("updated").innerHTML =
            "Senast uppdaterad: " + data.lastUpdated;

        const servicesDiv =
            document.getElementById("services");

        servicesDiv.innerHTML = "";

        let upCount = 0;

        data.services.forEach(service => {

            if(service.status === "up") {
                upCount++;
            }

            let speedClass = "green";

            if(service.responseTime > 500) {
                speedClass = "yellow";
            }

            if(service.responseTime > 1000) {
                speedClass = "red";
            }

            const card = document.createElement("div");
            card.className = "card";

            card.innerHTML = `
                <div class="service-info">

                    <div class="service-name">
                        ${service.name}
                    </div>

                    <div class="response-time ${speedClass}">
                        ${service.responseTime} ms
                    </div>

                </div>

                <div class="status ${service.status}">
                    ${service.status.toUpperCase()}
                </div>
            `;

            servicesDiv.appendChild(card);

        });

        const total = data.services.length;

        document.getElementById("summary").innerHTML =
            `✅ ${upCount}/${total} tjänster fungerar`;

    }
    catch(error) {

        document.getElementById("summary").innerHTML =
            "❌ Kunde inte läsa status.json";

        console.error(error);
    }
}

loadStatus();

setInterval(loadStatus, 60000);

</script>

</body>
</html>
