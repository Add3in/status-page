<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Statussida</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    color: #333;
}

.updated {
    color: #666;
    margin-bottom: 20px;
}

.card {
    background: white;
    margin-bottom: 10px;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
}

.service-name {
    font-weight: bold;
}

.status {
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
}

.up {
    background: #22c55e;
}

.down {
    background: #ef4444;
}

.summary {
    margin-bottom: 20px;
    padding: 15px;
    background: white;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 2px 4px rgba(0,0,0,.1);
}
</style>

</head>
<body>

<div class="container">

    <h1>📡 Driftstatus</h1>

    <div id="summary" class="summary">
        Laddar status...
    </div>

    <div id="updated" class="updated"></div>

    <div id="services"></div>

</div>

<script>
async function loadStatus() {
    const response = await fetch('status.json');
    const data = await response.json();

    document.getElementById('updated').innerHTML =
        'Senast uppdaterad: ' + data.lastUpdated;

    const services = document.getElementById('services');

    let upCount = 0;

    services.innerHTML = "";

    data.services.forEach(service => {

        if (service.status === "up") upCount++;

        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
            <div class="service-name">${service.name}</div>
            <div class="status ${service.status}">
                ${service.status.toUpperCase()}
            </div>
        `;

        services.appendChild(card);
    });

    const total = data.services.length;

    document.getElementById('summary').innerHTML =
        `✅ ${upCount}/${total} tjänster fungerar`;
}

loadStatus();

setInterval(loadStatus, 60000);
</script>

</body>
</html>
